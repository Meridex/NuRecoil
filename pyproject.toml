[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nurecoil"
version = "0.1.0"
description = "CEvNS event-rate calculator for reactor-neutrino experiments"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
]

[project.optional-dependencies]
conflux = ["conflux"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nurecoil*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.jupytext]
# All notebooks in examples/ are paired with a percent-format .py file.
# Only the .py files are tracked by git; .ipynb files are in .gitignore.
#
# To add a new example notebook:
#   1. Create the .py file (with # %% cell markers) in examples/, OR
#      create a new .ipynb and run:
#        jupytext --set-formats "ipynb,py:percent" examples/<name>.ipynb
#   2. Work in the .ipynb locally (run cells, view plots, etc.).
#      Jupytext keeps the .py in sync automatically on each save.
#   3. Commit only the .py file:
#        git add examples/<name>.py
#        git commit -m "..."
#   4. To restore the .ipynb on another machine:
#        jupytext --sync examples/<name>.py
formats = "ipynb,py:percent"
